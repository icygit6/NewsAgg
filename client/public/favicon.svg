<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- NewsAgg tab logo: brand gradient (cyan -> pink) rounded square with bold "N",
       matching the in-app logo (NavRail/TopBar). -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="28" fill="url(#brand)"/>
  <!-- Bold geometric "N" drawn as white vector shapes (union of two stems + diagonal) -->
  <g fill="#ffffff">
    <rect x="28" y="26" width="12" height="48"/>
    <rect x="60" y="26" width="12" height="48"/>
    <polygon points="28,26 41,26 72,74 59,74"/>
  </g>
</svg>
